<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Europe Travel Game Show</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* VOICE: loud, cheerful classroom game show for 9–11 year olds; big, readable from the back row.
   IDEA: a travel ticket counter — each game is a boarding pass to a European city.
   PICTURE: the game stage itself: a huge question card with a draining timer bar.
   COLOUR and TYPE: sky blue field, white ticket cards, coral accent, sunny yellow for wins; Fredoka + Nunito.
   LAYOUT: scoreboard strip on top, stage in the middle, award buttons underneath. */
:root{color-scheme:light dark;
 --bg:light-dark(#2F80E4,#0E2A52);--bg2:light-dark(#2670CF,#0A2142);
 --card:light-dark(#FFFDF8,#16365F);--ink:light-dark(#1B2A44,#F4F1E8);--soft:light-dark(#5A6780,#B9C7DD);
 --line:light-dark(#1B2A44,#06152B);--coral:#FF5A4E;--sun:#FFC845;--mint:#38C98A;
 --t0:#FF5A4E;--t1:#FFC845;--t2:#38C98A;--t3:#B57CFF}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:3px solid var(--line);border-radius:16px;min-height:48px;padding:8px 18px;background:var(--card);color:var(--ink);font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button.primary{background:var(--coral);color:#fff}
button.sun{background:var(--sun);color:#1B2A44}
button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);box-shadow:none}
header{background:var(--bg2);padding:14px max(4vw,14px);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{color:#fff;font-size:clamp(22px,3vw,32px);line-height:1.05;cursor:pointer}
header h1 span{color:var(--sun)}
.teams{display:flex;flex-wrap:wrap;gap:10px}
.team{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 8px 6px 12px;box-shadow:0 4px 0 var(--line);position:relative}
.team .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.team input{width:7.5em;border:0;background:transparent;color:var(--ink);font:600 17px Fredoka,sans-serif;padding:4px}
.team input:focus{outline:2px dashed var(--soft)}
.team .pts{font:700 30px Fredoka,sans-serif;min-width:1.6em;text-align:center}
.team button{min-height:36px;width:36px;padding:0;font-size:20px;border-width:2px;box-shadow:0 2px 0 var(--line);border-radius:10px}
.team.lead::before{content:"👑";position:absolute;top:-20px;left:8px;font-size:22px}
.team.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12)}}
main{padding:clamp(20px,3vw,40px) max(4vw,14px) 60px;max-width:1280px;margin:0 auto}
/* home */
.intro{color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin-bottom:24px}
.intro h2{font-size:clamp(30px,4vw,48px);line-height:1.05;text-wrap:balance}
.intro p{margin:6px 0 0;max-width:60ch;opacity:.92}
.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.setup span{color:#fff;font-weight:800}
.passes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:22px}
.pass{display:grid;grid-template-columns:minmax(0,1fr) 110px;text-align:left;padding:0;overflow:hidden;border-radius:22px;box-shadow:0 7px 0 var(--line);min-height:170px}
.pass .main{padding:18px 20px}
.pass .city{font:700 15px Fredoka,sans-serif;color:var(--coral);letter-spacing:.5px}
.pass h3{font-size:28px;line-height:1.1;margin:4px 0 6px}
.pass p{margin:0;color:var(--soft);font:600 15px/1.4 Nunito,sans-serif}
.pass .stub{border-left:3px dashed var(--line);display:grid;place-items:center;font-size:52px;background:light-dark(#EAF3FF,#1D4373)}
.pass .gate{font:600 14px Fredoka;color:var(--soft);margin-top:10px}
/* game */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:#fff;margin-bottom:16px}
.bar h2{font-size:clamp(26px,3.4vw,40px)}
.bar .round{font:600 18px Fredoka}
.stage{background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:0 9px 0 var(--line);padding:clamp(20px,3vw,40px);min-height:420px;display:flex;flex-direction:column;gap:22px}
.timer{height:16px;border-radius:99px;background:light-dark(#DCE6F3,#0B223F);overflow:hidden;border:2px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:var(--mint);transition:width .2s linear}
.timer.low i{background:var(--coral)}
.tline{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 20px Fredoka}
.q{font:700 clamp(28px,4.2vw,54px)/1.15 Fredoka,sans-serif;text-align:center;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opts button{font-size:clamp(20px,2.6vw,30px);min-height:84px;text-align:left;display:flex;gap:14px;align-items:center}
.opts b{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--sun);color:#1B2A44;flex:none;border:2px solid var(--line)}
.opts button.right{background:var(--mint);color:#06301D}
.opts button.wrong{opacity:.45}
.big{font-size:clamp(110px,18vw,200px);line-height:1;text-align:center}
.answer{font:700 clamp(34px,5vw,64px)/1.1 Fredoka;text-align:center;color:var(--coral);min-height:1.2em}
.answer.hide{visibility:hidden}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tiles button{font-size:clamp(20px,2.6vw,30px);min-height:62px;background:var(--sun);color:#1B2A44}
.tiles button.used{visibility:hidden}
.built{min-height:90px;border:3px dashed var(--soft);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.built button{font-size:clamp(20px,2.6vw,30px);min-height:58px}
.built.ok{border-color:var(--mint);border-style:solid;background:light-dark(#E2F8EE,#123E2D)}
.built.no{border-color:var(--coral);border-style:solid;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.word{font:700 clamp(40px,7vw,88px)/1.2 Fredoka;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:.12em;margin:0}
.word span{display:inline-block;min-width:.72em;text-align:center}
.word .gap{border-bottom:.09em solid var(--ink)}
.word .got{color:var(--coral);border-bottom:.09em solid var(--coral)}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.award{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin-top:4px;padding-top:18px;border-top:3px dashed light-dark(#C9D3E0,#2A4E7C)}
.award .lab{font:600 20px Fredoka;width:100%;text-align:center}
.award button{color:#1B2A44}
.cases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.case{min-height:120px;font-size:58px;display:grid;place-items:center;background:light-dark(#EAF3FF,#1D4373);position:relative}
.case small{position:absolute;top:6px;left:12px;font:600 18px Fredoka;color:var(--soft)}
.case.open{font:700 40px Fredoka;background:var(--sun);color:#1B2A44}
.case.open.neg{background:var(--coral);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.picker button[aria-pressed=true]{outline:4px solid var(--line);outline-offset:2px;transform:scale(1.06)}
.note{font-size:14px;color:var(--soft);text-align:center;margin:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.cases{grid-template-columns:repeat(3,minmax(0,1fr))}.pass{grid-template-columns:minmax(0,1fr) 80px}.team input{width:5.5em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
 <h1 id="home" title="Back to all games">Europe Travel <span>Game Show</span></h1>
 <div class="teams" id="teams"></div>
</header>
<main id="app"></main>
<canvas id="fx"></canvas>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- content (from the “Let’s Travel to Europe!” lesson) ---------- */
const QUIZ=[
 ["Where is the Eiffel Tower?",["Paris","London","Rome","Madrid"]],
 ["You need this to fly to another country.",["passport","postcard","keyring","magnet"]],
 ["The capital of Italy is ___.",["Rome","Berlin","Paris","Madrid"]],
 ["People in Spain speak ___.",["Spanish","French","German","Italian"]],
 ["How ___ is this postcard?",["much","many","long","old"]],
 ["Can I ___ a croissant, please?",["have","has","having","had"]],
 ["You look at this to find the way.",["map","charger","camera","jacket"]],
 ["“Bonjour” means hello in ___.",["French","Spanish","Italian","German"]],
 ["Go straight and turn ___.",["left","up","under","on"]],
 ["Big Ben is in ___.",["London","Paris","Rome","Berlin"]],
 ["I go to Rome ___ train.",["by","on","in","at"]],
 ["In France, people pay with the ___.",["euro","pound","dollar","yuan"]],
 ["Fish and chips is from ___.",["the UK","Italy","France","Spain"]],
 ["Show your ___ pass at the gate.",["boarding","bus","school","birthday"]],
 ["Someone helps you. You say: ___",["Thank you!","Sorry!","Goodbye!","Bless you!"]],
 ["The capital of Germany is ___.",["Berlin","Madrid","London","Rome"]]
];
const PICS=[["🛂","passport"],["🧳","suitcase"],["📷","camera"],["🗺️","map"],["🧥","jacket"],["🕶️","sunglasses"],["🔌","charger"],["✈️","plane"],["🚆","train"],["🚌","bus"],["🚕","taxi"],["🚲","bike"],["⛴️","boat"],["🍕","pizza"],["🍝","pasta"],["🥐","croissant"],["💌","postcard"],["🔑","keyring"],["🏰","castle"],["🏔️","mountain"],["🏖️","beach"],["🗼","Eiffel Tower"],["🎫","ticket"],["☕","café"]];
const SENTS=["Can I see your passport, please?","How much is this postcard?","I want to visit the Eiffel Tower.","Go straight and turn left.","I go to Rome by train.","Can I have a pizza, please?","Don’t forget your jacket!","There is a castle on the hill.","Where is the train station?","The capital of France is Paris.","I need to pack my sunglasses.","It’s next to the bank."];
const WORDS=[["passport","🛂"],["suitcase","🧳"],["camera","📷"],["ticket","🎫"],["jacket","🧥"],["sunglasses","🕶️"],["charger","🔌"],["airport","🛫"],["luggage","🧳"],["croissant","🥐"],["postcard","💌"],["castle","🏰"],["mountain","🏔️"],["beach","🏖️"],["Europe","🌍"],["France","🇫🇷"],["London","🕰️"],["holiday","🌞"],["museum","🏛️"],["souvenir","🎁"]];
const CASES=[1,1,1,2,2,2,3,3,5,-1,-2,0];

const GAMES=[
 {id:"quiz",city:"PARIS",name:"Quick Quiz",icon:"🗼",desc:"Read the question. The first team with the right answer wins the point.",pts:1,time:15,gate:"4 answers · 1 point"},
 {id:"pics",city:"LONDON",name:"Picture Shout",icon:"🕰️",desc:"A picture flashes up. Shout the English word before time runs out!",pts:1,time:8,gate:"Speed round · 1 point"},
 {id:"sent",city:"ROME",name:"Sentence Builder",icon:"🏛️",desc:"Tap the word cards in the right order to make a travel sentence.",pts:2,time:45,gate:"Word order · 2 points"},
 {id:"miss",city:"MADRID",name:"Missing Letters",icon:"🔤",desc:"Some letters flew away. Spell the whole word to win.",pts:2,time:25,gate:"Spelling · 2 points"},
 {id:"case",city:"BERLIN",name:"Lucky Suitcase",icon:"🧳",desc:"Bonus round! Pick a suitcase. Will you win points or lose them?",pts:0,time:0,gate:"Bonus · surprise points"}
];

/* ---------- teams ---------- */
let teams=[{n:"Team Paris",p:0},{n:"Team London",p:0},{n:"Team Rome",p:0},{n:"Team Madrid",p:0}],count=2;
try{const s=JSON.parse(localStorage.getItem("etgs")||"null");if(s&&s.teams){teams=s.teams;count=s.count}}catch(e){}
const save=()=>{try{localStorage.setItem("etgs",JSON.stringify({teams,count}))}catch(e){}};
const active=()=>teams.slice(0,count);
function drawTeams(){
 const max=Math.max(...active().map(t=>t.p));
 $("#teams").innerHTML=active().map((t,i)=>`<div class="team${t.p>0&&t.p===max&&active().filter(x=>x.p===max).length===1?' lead':''}" id="team${i}">
 <span class="dot" style="background:var(--t${i})"></span><input aria-label="Team ${i+1} name" data-i="${i}" value="${esc(t.n)}">
 <button data-d="-1" data-i="${i}" aria-label="Take a point from ${esc(t.n)}">−</button><span class="pts">${t.p}</span><button data-d="1" data-i="${i}" aria-label="Give a point to ${esc(t.n)}">+</button></div>`).join("");
}
function addPts(i,d){
 teams[i].p+=d;save();drawTeams();
 const el=$("#team"+i);if(el){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
 if(d>0){sound("win");confetti(i)}else if(d<0)sound("lose");
}
$("#teams").addEventListener("click",e=>{const b=e.target.closest("button");if(b)addPts(+b.dataset.i,+b.dataset.d)});
$("#teams").addEventListener("input",e=>{if(e.target.dataset.i){teams[+e.target.dataset.i].n=e.target.value;save()}});
$("#teams").addEventListener("change",()=>{drawTeams();if(cur)render()});

/* ---------- sound + confetti ---------- */
let ac;
function sound(kind){
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const notes={win:[523,659,784,1047],lose:[330,247],tick:[880],click:[600],end:[440,330,220]}[kind];
  notes.forEach((f,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==="lose"||kind==="end"?"sawtooth":"triangle";o.frequency.value=f;
   const t=ac.currentTime+k*.11;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
   o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.2)});
 }catch(e){}
}
const cv=$("#fx"),cx=cv.getContext("2d");let bits=[],raf=0;
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(i){
 if(still)return;cv.width=innerWidth;cv.height=innerHeight;
 const el=$("#team"+i),r=el?el.getBoundingClientRect():{left:innerWidth/2,top:60,width:0,height:0};
 const cols=["#FF5A4E","#FFC845","#38C98A","#B57CFF","#FFFDF8"];
 for(let k=0;k<70;k++)bits.push({x:r.left+r.width/2,y:r.top+r.height,vx:(Math.random()-.5)*12,vy:Math.random()*-4-2,s:Math.random()*8+5,c:cols[k%5],a:Math.random()*6,life:90});
 if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 bits=bits.filter(b=>b.life-->0);
 for(const b of bits){b.vy+=.35;b.x+=b.vx;b.y+=b.vy;b.a+=.2;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;cx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);cx.restore()}
 raf=bits.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- timer ---------- */
let tId=0,left=0,total=0;
function startTimer(sec){
 stopTimer();total=left=sec;paintTimer();
 tId=setInterval(()=>{left-=.2;if(left<=3&&left>0&&Math.abs(left-Math.round(left))<.1)sound("tick");
  if(left<=0){left=0;stopTimer();sound("end");if(state)state.timeUp=true;reveal()}paintTimer()},200);
}
function stopTimer(){clearInterval(tId);tId=0}
function paintTimer(){const t=$(".timer");if(!t)return;t.querySelector("i").style.width=(total?left/total*100:0)+"%";t.classList.toggle("low",left<=total*.3);$("#secs").textContent=Math.ceil(left)+"s"}

/* ---------- views ---------- */
let cur=null,state=null,decks={};
function home(){
 stopTimer();cur=null;state=null;
 $("#app").innerHTML=`<section class="intro"><div><h2>Pick a flight and play!</h2><p>Each game uses words and sentences from “Let’s Travel to Europe!”. The teacher gives points with the buttons under each question, or with + and − on the scoreboard.</p></div>
 <div class="setup"><span>Teams:</span>${[2,3,4].map(n=>`<button class="${n===count?'sun':''}" data-count="${n}" aria-pressed="${n===count}">${n}</button>`).join("")}<button class="ghost" id="reset">Reset scores</button></div></section>
 <section class="passes">${GAMES.map((g,i)=>`<button class="pass" data-g="${i}"><span class="main"><span class="city">FLIGHT TO ${g.city}</span><h3>${g.name}</h3><p>${g.desc}</p><p class="gate">${g.gate}</p></span><span class="stub" aria-hidden="true">${g.icon}</span></button>`).join("")}</section>`;
}
function deck(id,list){if(!decks[id]||!decks[id].length)decks[id]=shuffle(list.map((_,i)=>i));return decks[id].pop()}
function open(i){cur=GAMES[i];state={n:0};next()}
function next(){
 const g=cur;state={n:state.n+1,done:false,timeUp:false};
 if(g.id==="quiz"){const q=QUIZ[deck("quiz",QUIZ)];state.q=q[0];state.ans=q[1][0];state.opts=shuffle(q[1])}
 if(g.id==="pics"){const p=PICS[deck("pics",PICS)];state.pic=p[0];state.ans=p[1]}
 if(g.id==="sent"){const s=SENTS[deck("sent",SENTS)];state.ans=s;state.words=s.split(" ");state.order=shuffle(state.words.map((_,i)=>i));
  while(state.words.length>2&&state.order.every((v,i)=>v===i))state.order=shuffle(state.order);state.built=[]}
 if(g.id==="miss"){const w=WORDS[deck("miss",WORDS)];state.ans=w[0];state.pic=w[1];const idx=shuffle([...w[0]].map((_,i)=>i).slice(1));state.hidden=new Set(idx.slice(0,Math.max(2,Math.round(w[0].length*.45))))}
 if(g.id==="case"){state.cases=shuffle(CASES).map(v=>({v,open:false}));state.team=0}
 render();if(g.time)startTimer(g.time);
}
function reveal(){if(!state||state.done)return;state.done=true;stopTimer();render()}
function render(){
 const g=cur,s=state;let body="";
 const timer=g.time?`<div class="tline"><span>${s.timeUp?"Time’s up!":"Time"}</span><span id="secs"></span></div><div class="timer"><i></i></div>`:"";
 if(g.id==="quiz")body=`<p class="q">${esc(s.q)}</p><div class="opts">${s.opts.map((o,i)=>`<button data-opt="${i}" class="${s.done?(o===s.ans?'right':'wrong'):''}"><b>${"ABCD"[i]}</b>${esc(o)}</button>`).join("")}</div>`;
 if(g.id==="pics")body=`<div class="big" aria-label="Picture">${s.pic}</div><p class="answer${s.done?'':' hide'}">${esc(s.ans)}</p>`;
 if(g.id==="sent")body=`<div class="built${s.done?(s.ok?' ok':''):''}" id="built" aria-label="Your sentence">${s.done&&!s.ok?`<span class="q" style="font-size:clamp(24px,3.4vw,40px)">${esc(s.ans)}</span>`:s.built.map((w,k)=>`<button data-back="${k}">${esc(s.words[w])}</button>`).join("")||'<span class="note">Tap the words below in the right order</span>'}</div>
  <div class="tiles">${s.order.map(w=>`<button data-tile="${w}" class="${s.built.includes(w)||s.done?'used':''}">${esc(s.words[w])}</button>`).join("")}</div>`;
 if(g.id==="miss")body=`<div class="big" style="font-size:clamp(80px,12vw,130px)" aria-hidden="true">${s.pic}</div><p class="word" aria-label="Word with missing letters">${[...s.ans].map((c,i)=>s.hidden.has(i)?(s.done?`<span class="got">${esc(c)}</span>`:`<span class="gap">&nbsp;</span>`):`<span>${esc(c)}</span>`).join("")}</p>`;
 if(g.id==="case")body=`<div class="picker"><span class="f" style="font-size:20px">Who is choosing?</span>${active().map((t,i)=>`<button data-pick="${i}" aria-pressed="${s.team===i}" style="background:var(--t${i});color:#1B2A44">${esc(t.n)}</button>`).join("")}</div>
  <div class="cases">${s.cases.map((c,i)=>`<button class="case${c.open?' open'+(c.v<0?' neg':''):''}" data-case="${i}" ${c.open?'disabled':''}>${c.open?(c.v>0?'+'+c.v:c.v===0?'0 😅':c.v):'🧳'}${c.open?'':`<small>${i+1}</small>`}</button>`).join("")}</div>
  <p class="note">Inside: +1, +2, +3, +5… or −1, −2! Points go to the team that is choosing.</p>`;
 const ctrl=g.id==="case"?`<div class="controls"><button class="sun" id="next">New suitcases</button></div>`:
  `<div class="controls">${s.done?`<button class="primary" id="next">Next question ➜</button>`:`<button class="sun" id="show">Show answer</button>`}${g.id==="miss"&&!s.done?`<button id="hint">Give a letter</button>`:""}${g.id==="sent"&&!s.done?`<button id="check">Check</button><button id="clear">Clear</button>`:""}${g.time?`<button id="again">Restart timer</button>`:""}</div>
  <div class="award"><span class="lab">Who got it right? +${g.pts} point${g.pts>1?'s':''}</span>${active().map((t,i)=>`<button data-award="${i}" style="background:var(--t${i})">${esc(t.n)}</button>`).join("")}</div>`;
 $("#app").innerHTML=`<div class="bar"><h2>${g.icon} ${g.name}</h2><span class="round">${g.id==="case"?"Bonus round":"Question "+s.n}</span><button class="ghost" id="back">← All games</button></div>
 <section class="stage">${timer}${body}${ctrl}</section>`;
 if(g.time)paintTimer();
}
function checkSentence(){
 const s=state;if(s.built.length!==s.words.length)return;
 s.ok=s.built.map(i=>s.words[i]).join(" ")===s.ans;
 if(s.ok){reveal();sound("win")}else{sound("lose");const b=$("#built");b.classList.remove("no");void b.offsetWidth;b.classList.add("no")}
}

$("#home").addEventListener("click",home);
$("#app").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.count){count=+d.count;save();drawTeams();home();return}
 if(b.id==="reset"){teams.forEach(t=>t.p=0);save();drawTeams();return}
 if(d.g!==undefined){sound("click");open(+d.g);return}
 if(b.id==="back"){home();return}
 if(b.id==="next"){sound("click");next();return}
 if(b.id==="show"){reveal();return}
 if(b.id==="again"&&!state.done){state.timeUp=false;startTimer(cur.time);return}
 if(d.award!==undefined){addPts(+d.award,cur.pts);if(!state.done)reveal();return}
 if(d.opt!==undefined&&!state.done){const ok=state.opts[+d.opt]===state.ans;sound(ok?"win":"lose");if(ok)reveal();else{b.classList.add("wrong");b.disabled=true}return}
 if(d.tile!==undefined&&!state.done){state.built.push(+d.tile);sound("click");render();if(state.built.length===state.words.length)checkSentence();return}
 if(d.back!==undefined&&!state.done){state.built.splice(+d.back,1);render();return}
 if(b.id==="clear"){state.built=[];render();return}
 if(b.id==="check"){checkSentence();return}
 if(b.id==="hint"){const h=[...state.hidden];if(h.length>1){state.hidden.delete(h[Math.floor(Math.random()*h.length)]);render()}return}
 if(d.pick!==undefined){state.team=+d.pick;render();return}
 if(d.case!==undefined){const c=state.cases[+d.case];if(c.open)return;c.open=true;render();if(c.v)addPts(state.team,c.v);else sound("lose");return}
});
addEventListener("keydown",e=>{if(e.target!==document.body||!cur)return;
 if(e.key==="Escape")home();else if(e.key===" "||e.key==="Enter"){if(cur.id!=="case"){e.preventDefault();state.done?next():reveal()}}});
drawTeams();home();
}
</script>
</body>
</html>
